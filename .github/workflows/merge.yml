name: Merge Rules (V3)

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'merger/**'
      - 'merge_rules.py'
      - 'config_loader.py'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate config
        run: |
          python merge_rules.py validate config/sources.yaml

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: rule-cache-${{ github.run_id }}
          restore-keys: |
            rule-cache-

      - name: Run merge (V3 async)
        run: |
          echo "::group::Merge Output"
          python merge_rules.py merge \
            --config config/sources.yaml \
            --output output/merged_rules.txt \
            --report \
            --report-format markdown \
            --compress \
            --cache-dir cache \
            --cache-max-size 500
          echo "::endgroup::"

      - name: Save cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: rule-cache-${{ github.run_id }}

      - name: Check for changes
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if output changed
          if git diff --quiet output/merged_rules.txt 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in merged rules"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Rules changed, will commit"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add output/merged_rules.txt output/merged_rules.txt.gz output/stats.json output/*.report.md 2>/dev/null || true
          git commit -m "Auto-merge: update rules $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git push || echo "Push failed (may be no changes)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merged-rules
          path: |
            output/merged_rules.txt
            output/merged_rules.txt.gz
            output/stats.json
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-benchmark

      - name: Run tests
        run: |
          echo "::group::Test Output"
          python -m pytest tests/test_core.py -v --tb=short
          echo "::endgroup::"

      - name: Run benchmark (quick)
        run: |
          echo "::group::Benchmark Output"
          python -m pytest tests/benchmark.py --benchmark-only --benchmark-columns=min,max,mean,stddev,ops -q || echo "Benchmark skipped"
          echo "::endgroup::"
