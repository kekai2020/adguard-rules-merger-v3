concurrency:
  group: merge-rules-${{ github.ref }}
  cancel-in-progress: false
  
name: Merge Rules (V3)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'merger/**'
      - 'merge_rules.py'
      - 'config_loader.py'
      - 'requirements.txt'
      - '.github/workflows/merge.yml'

permissions:
  contents: write

concurrency:
  group: merge-rules-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate config
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from merge_rules import app; app()" validate config/sources.yaml

      - name: Restore rule cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: rule-cache-v3-${{ hashFiles('config/sources.yaml') }}
          restore-keys: |
            rule-cache-v3-

      - name: Debug environment
        run: |
          echo "Current directory: $(pwd)"
          echo "PYTHONPATH: $PYTHONPATH"
          ls -la
          ls -la merger/
          python -c "import sys; print('sys.path:', sys.path[:3])"

      - name: Run merge
        id: merge
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "::group::Merge Output"
          python -c "from merge_rules import app; app()" merge \
            --config config/sources.yaml \
            --output output/merged_rules.txt \
            --report \
            --report-format markdown \
            --cache-dir cache \
            --cache-max-size 500
          echo "::endgroup::"

      - name: Check for changes
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CHANGED=false
          if ! git diff --quiet -- output/ 2>/dev/null; then
            CHANGED=true
            echo "Modified files detected in output/"
          fi
          if git ls-files --others --exclude-standard -- output/ | grep -q .; then
            CHANGED=true
            echo "New files detected in output/"
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add output/
          git commit -m "Auto-merge: update rules $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git pull --rebase origin main || true
          git push

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-rules-${{ github.run_id }}
          path: |
            output/merged_rules.txt
            output/stats.json
            output/*.report.md
          retention-days: 30
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "::group::Test Output"
          python -m pytest tests/test_core.py -v --tb=short
          echo "::endgroup::"
