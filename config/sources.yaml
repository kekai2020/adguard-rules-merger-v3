# AdGuard Filter Sources Configuration (V3)
# This file contains the list of filter sources to merge
# V3 enhancements: category tags, reputation scores, per-source timeout

# ── Global merge settings ──────────────────────────────────────────
timeout: 60
max_concurrency: 50
allow_overrides_block: true
enable_normalized_dedup: true
strip_www: true

# ── Cache settings ──────────────────────────────────────────────────
cache:
  enabled: true
  directory: cache
  ttl_seconds: 0          # 0 = no time-based expiry
  max_size_mb: 500        # 0 = unlimited

# ── Output settings ─────────────────────────────────────────────────
output:
  directory: output
  filename: merged_rules.txt
  formats:
    - adguard
  compress: false
  include_stats: true
  include_report: true

# ── Rule sources ────────────────────────────────────────────────────
